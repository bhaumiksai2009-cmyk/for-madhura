<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Madhura ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fff0f3; --pink: #ff4d6d; --rose: #c9184a; }
        body { margin: 0; background: var(--bg); font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; text-align: center; }
        
        .heart { width: 80px; height: 80px; background: var(--pink); position: relative; transform: rotate(-45deg); animation: beat 0.8s infinite alternate; margin: 0 auto 30px; cursor: pointer; z-index: 100; }
        .heart:before, .heart:after { content: ""; width: 80px; height: 80px; background: var(--pink); border-radius: 50%; position: absolute; }
        .heart:before { top: -40px; left: 0; }
        .heart:after { left: 40px; top: 0; }
        @keyframes beat { to { transform: scale(1.1) rotate(-45deg); } }

        #main-content { display: none; width: 90%; max-width: 400px; }
        .note-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .btn-wrap { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 30px; min-height: 200px; }

        button { 
            padding: 15px 25px; border: none; border-radius: 50px; 
            font-weight: bold; font-size: 1rem; cursor: pointer; 
            transition: all 0.3s ease-out; /* Smooth growing effect */
        }

        #of-course { background: var(--pink); color: white; z-index: 10; position: relative; }

        #yes-btn { 
            background: white; color: var(--pink); border: 2px solid var(--pink);
            position: absolute; z-index: 20;
        }

        .particle { position: fixed; top: -10%; z-index: 1; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
    </style>
</head>
<body>

    <div id="start-screen" onclick="begin()">
        <div class="heart"></div>
        <h1 style="font-family: 'Dancing Script'; color: var(--rose); font-size: 2.5rem;">For Madhura</h1>
        <p>Tap the heart for your surprise... ❤️</p>
    </div>

    <div id="main-content">
        <h2 style="font-family: 'Dancing Script'; color: var(--rose);">Happy Valentine's Day!</h2>
        <div class="note-card">
            <p>"I don't need any reason to love you, Madhura. You are my everything."</p>
        </div>
        
        <h3 id="question-text">Will you be my Valentine?</h3>
        <div class="btn-wrap">
            <button id="of-course" onclick="celebrate()">Of Course!</button>
            <button id="yes-btn" onmouseover="dodge()" onclick="dodge()">Yes</button>
        </div>
    </div>

    <audio id="audio" src="music.mp3" loop></audio>

    <script>
        let scale = 1;

        function begin() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            const song = document.getElementById('audio');
            song.play().catch(() => console.log("Audio needs user interaction first"));
        }

        function dodge() {
            const yesBtn = document.getElementById('yes-btn');
            const ofCourseBtn = document.getElementById('of-course');

            // 1. Move the YES button to a random spot on screen
            const padding = 100;
            const newX = Math.random() * (window.innerWidth - padding);
            const newY = Math.random() * (window.innerHeight - padding);
            
            yesBtn.style.position = 'fixed';
            yesBtn.style.left = `${newX}px`;
            yesBtn.style.top = `${newY}px`;

            // 2. Make the OF COURSE button bigger
            scale += 0.3; // Increases size by 30% each time
            ofCourseBtn.style.transform = `scale(${scale})`;
            
            // 3. Optional: Make the "Yes" button smaller as it runs away
            let currentYesScale = 1 - (scale * 0.05);
            if (currentYesScale > 0.4) {
                yesBtn.style.transform = `scale(${currentYesScale})`;
            }
        }

        function celebrate() {
            // Remove buttons
            document.getElementById('yes-btn').remove();
            document.getElementById('of-course').remove();
            document.getElementById('question-text').remove();

            document.getElementById('main-content').innerHTML = `
                <h1 style='font-family:"Dancing Script"; color:var(--rose); font-size:3.5rem;'>I Love You Madhura! ❤️</h1>
                <p style="font-size: 1.2rem;">You made the right choice! ✨</p>
            `;
            
            // Explosion of hearts, stars, and roses
            setInterval(() => {
                const p = document.createElement('div');
                p.classList.add('particle');
                const items = ['❤️', '⭐', '🌹', '✨', '🌸'];
                p.innerHTML = items[Math.floor(Math.random() * items.length)];
                p.style.left = Math.random() * 100 + "vw";
                p.style.fontSize = Math.random() * 20 + 20 + "px";
                p.style.animationDuration = (Math.random() * 3 + 2) + "s";
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 5000);
            }, 80);
        }
    </script>
</body>
</html>
