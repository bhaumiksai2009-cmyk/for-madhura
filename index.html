<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Madhura ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff0f3;
            --primary-pink: #ff4d6d;
            --rose-red: #c9184a;
            --gold: #ffd700;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Initial Heart */
        .heart-loader { cursor: pointer; z-index: 10; }
        .heart {
            width: 100px; height: 100px;
            background-color: var(--primary-pink);
            position: relative;
            transform: rotate(-45deg);
            animation: beat 0.8s infinite alternate;
            margin: 0 auto 40px;
        }
        .heart:before, .heart:after {
            content: ""; width: 100px; height: 100px;
            background-color: var(--primary-pink);
            border-radius: 50%; position: absolute;
        }
        .heart:before { top: -50px; left: 0; }
        .heart:after { left: 50px; top: 0; }

        @keyframes beat { to { transform: scale(1.2) rotate(-45deg); } }

        /* Content Container */
        #main-content { display: none; width: 90%; max-width: 450px; z-index: 5; }
        
        .gif-frame { width: 100%; max-width: 220px; border-radius: 20px; margin-bottom: 20px; border: 5px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        .lyrics-wrap { height: 60px; margin-bottom: 20px; }
        .lyric-line { font-family: 'Dancing Script', cursive; font-size: 1.8rem; color: var(--rose-red); font-weight: bold; }

        .note-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            border-left: 5px solid var(--primary-pink);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        /* Interactive Buttons */
        #question-area { display: none; position: relative; height: 150px; }
        .btn-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        
        button {
            padding: 15px 30px; border: none; border-radius: 50px;
            font-weight: 600; cursor: pointer; transition: 0.3s; font-family: 'Poppins';
        }

        #of-course { background: var(--primary-pink); color: white; box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4); }

        #yes-btn { 
            background: white; color: var(--primary-pink); 
            border: 2px solid var(--primary-pink);
            position: absolute; 
        }

        /* Confetti Elements */
        .particle {
            position: fixed; top: -10%;
            user-select: none; z-index: 1;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }
    </style>
</head>
<body>

    <div id="start-screen" class="heart-loader" onclick="begin()">
        <div class="heart"></div>
        <h1 style="color: var(--primary-pink); font-family: 'Dancing Script';">For Madhura</h1>
        <p style="color: #888;">Tap the heart to start our song...</p>
    </div>

    <div id="main-content">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHJmYmxoZmdycG1wYjZ4bmNreWp4N21vN3R0eHh3eHh3eHh3eHh3JnB0PWVufmNvbG9yJmVudGl0eT1naWY/MDJ9uUv3p_S4fR2XWd/giphy.gif" class="gif-frame">
        
        <div class="lyrics-wrap">
            <div id="lyric-display" class="lyric-line"></div>
        </div>

        <div class="note-card">
            <h3 style="margin-top:0">Reasons Why I Love You</h3>
            <p>"I don't need any reason to love you, Madhura. You are the reason for my happiness."</p>
        </div>

        <div id="question-area">
            <h2 style="font-family: 'Dancing Script';">Will you be my Valentine?</h2>
            <div class="btn-container">
                <button id="of-course" onclick="celebrate()">Of Course!</button>
                <button id="yes-btn" onmouseover="dodge()" onclick="dodge()">Yes</button>
            </div>
        </div>
    </div>

    <audio id="audio" src="YOUR_LINK_TO_JANAM_JANAM.mp3"></audio>

    <script>
        const songLyrics = [
            { t: 0, text: "Janam janam..." },
            { t: 3, text: "Janam saath chalna yunhi" },
            { t: 7, text: "Kasam tumhe kasam..." },
            { t: 10, text: "Aake milna yahin" },
            { t: 14, text: "Meri subah ho tumhi..." },
            { t: 18, text: "Aur tumhi shaam ho!" },
            { t: 22, text: "For you, Madhura... ❤️" }
        ];

        const audio = document.getElementById('audio');
        const lyricEl = document.getElementById('lyric-display');

        function begin() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            audio.play();
        }

        audio.ontimeupdate = () => {
            const now = audio.currentTime;
            songLyrics.forEach(line => {
                if (now >= line.t) {
                    lyricEl.innerText = line.text;
                }
            });
            if (now > 24) { 
                document.getElementById('question-area').style.display = 'block'; 
            }
        };

        function dodge() {
            const btn = document.getElementById('yes-btn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('question-area').innerHTML = "<h1 style='font-family:\"Dancing Script\"; font-size: 3rem;'>I Love You! ❤️</h1>";
            setInterval(spawnParticles, 100);
        }

        function spawnParticles() {
            const types = ['❤️', '⭐', '🌹', '✨', '🌸'];
            const p = document.createElement('div');
            p.classList.add('particle');
            p.innerHTML = types[Math.floor(Math.random() * types.length)];
            p.style.left = Math.random() * 100 + "vw";
            p.style.fontSize = (Math.random() * 20 + 15) + "px";
            p.style.animationDuration = (Math.random() * 3 + 2) + "s";
            p.style.opacity = Math.random();
            document.body.appendChild(p);
            setTimeout(() => { p.remove(); }, 5000);
        }
    </script>
</body>
</html>
