<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Madhura ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fff0f3; --pink: #ff4d6d; --rose: #c9184a; }
        body { margin: 0; background: var(--bg); font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; text-align: center; }
        .heart { width: 80px; height: 80px; background: var(--pink); position: relative; transform: rotate(-45deg); animation: beat 0.8s infinite alternate; margin: 0 auto 30px; }
        .heart:before, .heart:after { content: ""; width: 80px; height: 80px; background: var(--pink); border-radius: 50%; position: absolute; }
        .heart:before { top: -40px; left: 0; }
        .heart:after { left: 40px; top: 0; }
        @keyframes beat { to { transform: scale(1.1) rotate(-45deg); } }
        #main-content { display: none; width: 90%; max-width: 400px; }
        .note-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        #question-area { margin-top: 20px; position: relative; height: 100px; }
        .btn-wrap { display: flex; justify-content: center; gap: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
        #of-course { background: var(--pink); color: white; }
        #yes-btn { background: white; color: var(--pink); border: 1px solid var(--pink); position: absolute; }
        .particle { position: fixed; top: -10%; z-index: 1; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
    </style>
</head>
<body>

    <div id="start-screen" onclick="begin()">
        <div class="heart"></div>
        <h1 style="font-family: 'Dancing Script'; color: var(--rose);">For Madhura</h1>
        <p>Tap to open your surprise ❤️</p>
    </div>

    <div id="main-content">
        <h2 style="font-family: 'Dancing Script'; color: var(--rose);">Happy Valentine's Day!</h2>
        <div class="note-card">
            <p>"I don't need any reason to love you, Madhura. You are my everything."</p>
        </div>
        <div id="question-area">
            <h3>Will you be my Valentine?</h3>
            <div class="btn-wrap">
                <button id="of-course" onclick="celebrate()">Of Course!</button>
                <button id="yes-btn" onmouseover="dodge()" onclick="dodge()">Yes</button>
            </div>
        </div>
    </div>

    <audio id="audio" src="music.mp3"></audio>

    <script>
        function begin() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            const song = document.getElementById('audio');
            song.play().catch(e => console.log("Audio play failed, but that's okay!"));
        }

        function dodge() {
            const btn = document.getElementById('yes-btn');
            btn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            btn.style.top = Math.random() * (window.innerHeight - 100) + 'px';
        }

        function celebrate() {
            document.getElementById('main-content').innerHTML = "<h1 style='font-family:\"Dancing Script\"; color:var(--rose); font-size:3rem;'>I Love You Madhura! ❤️</h1>";
            setInterval(() => {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.innerHTML = ['❤️', '⭐', '🌹'][Math.floor(Math.random() * 3)];
                p.style.left = Math.random() * 100 + "vw";
                p.style.fontSize = "20px";
                p.style.animationDuration = (Math.random() * 3 + 2) + "s";
                document.body.appendChild(p);
            }, 100);
        }
    </script>
</body>
</html>
