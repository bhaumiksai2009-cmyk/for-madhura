<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Love ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fff0f3; --pink: #ff4d6d; --rose: #c9184a; }
        body { 
            margin: 0; background: var(--bg); font-family: 'Poppins', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; width: 100vw; overflow: hidden; text-align: center; 
            touch-action: none; transition: background 2s ease;
        }

        /* 0. Gatekeeper Screen */
        #gatekeeper { z-index: 2000; position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input { padding: 12px; border-radius: 10px; border: 2px solid var(--pink); margin-top: 15px; text-align: center; font-size: 1.1rem; outline: none; }
        .gate-btn { background: var(--pink); color: white; padding: 10px 25px; border: none; border-radius: 10px; margin-top: 15px; cursor: pointer; font-weight: bold; }

        /* 1. Heart Start Screen */
        #start-screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .heart { width: 80px; height: 80px; background: var(--pink); position: relative; transform: rotate(-45deg); animation: beat 0.8s infinite alternate; margin: 0 auto 30px; cursor: pointer; }
        .heart:before, .heart:after { content: ""; width: 80px; height: 80px; background: var(--pink); border-radius: 50%; position: absolute; }
        .heart:before { top: -40px; left: 0; }
        .heart:after { left: 40px; top: 0; }
        @keyframes beat { to { transform: scale(1.1) rotate(-45deg); } }

        /* 2. Main Question Screen */
        #main-content { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; position: relative; }
        .btn-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; position: relative; margin-top: 40px; height: 200px; }
        button { padding: 15px 45px; border: none; border-radius: 50px; font-weight: bold; font-size: 1.3rem; cursor: pointer; transition: transform 0.2s; }
        #yes-btn { background: var(--pink); color: white; z-index: 5; position: relative; }
        #no-btn { background: white; color: var(--rose); border: 2px solid var(--rose); position: absolute; z-index: 999; transition: all 0.3s ease; }

        /* 3. Reason Slide */
        #final-slide { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .reason-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 0 40px rgba(255, 77, 109, 0.2); margin: 20px; max-width: 300px; border: 2px solid var(--pink); }
        #exit-btn { margin-top: 20px; background: #333; color: white; padding: 10px 20px; border-radius: 10px; opacity: 0.7; }
        
        /* Final Image Styles */
        .final-photo { 
            width: 280px; height: 280px; object-fit: cover; 
            border-radius: 20px; border: 8px solid white; 
            margin-bottom: 25px; animation: float 3s ease-in-out infinite, fadeIn 2s;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Background Effects */
        .blackout { background: black !important; }
        .fade-out { opacity: 0; transition: 1s; }
        .sparkle { position: absolute; pointer-events: none; animation: fly 1s forwards; z-index: 1001; color: var(--rose); }
        @keyframes fly { to { transform: translate(var(--tw), var(--th)) rotate(360deg); opacity: 0; } }
        .particle { position: fixed; top: -10%; z-index: 1; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
    </style>
</head>
<body>

    <div id="gatekeeper">
        <h2 style="font-family: 'Dancing Script'; color: var(--rose); font-size: 2.2rem;">Stop! Who is this?</h2>
        <input type="text" id="nameInput" placeholder="Enter your name...">
        <button class="gate-btn" onclick="checkName()">Open Surprise</button>
        <p id="error-msg" style="color: var(--rose); margin-top: 10px; font-size: 0.9rem; display: none;">Sorry, this surprise isn't for you! ❤️</p>
    </div>

    <div id="start-screen" onclick="begin()">
        <div class="heart"></div>
        <h1 style="font-family: 'Dancing Script'; color: var(--rose); font-size: 3rem;">For Madhura</h1>
        <p>Tap the heart to start... ❤️</p>
    </div>

    <div id="main-content">
        <h1 style="font-family: 'Dancing Script'; color: var(--rose); font-size: 2.5rem;">Madhura,</h1>
        <h2 style="font-family: 'Poppins';">Will you be my Valentine?</h2>
        <div class="btn-wrap">
            <button id="yes-btn" onclick="celebrate()">YES</button>
            <button id="no-btn" onmouseover="dodge()" onclick="dodge()" style="top: 140px;">NO</button>
        </div>
    </div>

    <div id="final-slide">
        <h1 style="font-family: 'Dancing Script'; color: var(--rose); font-size: 3.5rem;">I Love You! ❤️</h1>
        <div class="reason-card">
            <p style="font-size: 1.2rem; font-style: italic;">"I don't need any reason to love you."</p>
        </div>
        <button id="exit-btn" onclick="exitProgram()">Close Surprise</button>
    </div>

    <script>
        let scale = 1;

        function checkName() {
            const name = document.getElementById('nameInput').value.trim().toLowerCase();
            if (name === "madhura") {
                document.getElementById('gatekeeper').style.display = 'none';
                document.getElementById('start-screen').style.display = 'flex';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function begin() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
        }

        function dodge() {
            const noBtn = document.getElementById('no-btn');
            const yesBtn = document.getElementById('yes-btn');
            const margin = 80;
            const maxX = window.innerWidth - noBtn.offsetWidth - margin;
            const maxY = window.innerHeight - noBtn.offsetHeight - margin;
            const randomX = Math.max(margin, Math.floor(Math.random() * maxX));
            const randomY = Math.max(margin, Math.floor(Math.random() * maxY));
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            scale += 0.45;
            yesBtn.style.transform = `scale(${scale})`;
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('no-btn').style.display = 'none';
            document.getElementById('final-slide').style.display = 'flex';
            setInterval(() => {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.innerHTML = ['❤️', '🌹', '✨'][Math.floor(Math.random() * 3)];
                p.style.left = Math.random() * 100 + "vw";
                p.style.fontSize = "25px";
                p.style.animationDuration = (Math.random() * 3 + 2) + "s";
                document.body.appendChild(p);
            }, 100);
        }

        function exitProgram() {
            // Start the transition
            document.body.classList.add('blackout');
            document.getElementById('final-slide').classList.add('fade-out');
            setTimeout(() => {
                document.body.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; color:white;">
                        <img src="us.jpg" class="final-photo" onerror="this.style.display='none'">
                        <h1 style='font-family: Dancing Script; font-size: 3rem; margin: 0;'>Forever Yours. ❤️</h1>
                    </div>
                `;
            }, 1500);
        }

        // Sparkle Trail
        document.addEventListener('mousemove', (e) => spawnSparkle(e.pageX, e.pageY));
        document.addEventListener('touchmove', (e) => spawnSparkle(e.touches[0].pageX, e.touches[0].pageY));

        function spawnSparkle(x, y) {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.innerHTML = '✨';
            s.style.left = x + 'px'; s.style.top = y + 'px';
            s.style.setProperty('--tw', (Math.random() * 80 - 40) + 'px');
            s.style.setProperty('--th', (Math.random() * 80 - 40) + 'px');
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 1000);
        }
    </script>
</body>
</html>
